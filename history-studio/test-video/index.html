<!doctype html>
<html
  lang="en"
  data-composition-variables='[{"id":"kicker","type":"string","label":"Kicker","default":"Episode 0 · Studio test"},{"id":"title","type":"string","label":"Title","default":"The History Studio"},{"id":"subtitle","type":"string","label":"Subtitle","default":"Title card · Kokoro voice bm_george · rendered with HyperFrames"}]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #15100c;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="10"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="title-card"
        data-composition-id="title-card"
        data-composition-src="compositions/title-card.html"
        data-start="0"
        data-duration="10"
        data-track-index="0"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <audio
        id="narration"
        class="clip"
        src="assets/narration.wav"
        data-start="1.2"
        data-track-index="1"
        data-volume="1"
      ></audio>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
